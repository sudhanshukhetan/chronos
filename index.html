<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHRONOS: Genesis of the Living Sphere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#d4af37;--c:#38bdf8}
*{box-sizing:border-box;margin:0}
body{background:#03050a;color:#e6edf7;font:400 15px/1.65 Inter,system-ui,sans-serif;overflow-x:hidden}
#c{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1;display:block}
#sp{height:900vh}
#tl{position:fixed;top:0;left:0;right:0;z-index:4;padding:12px 250px 0 4vw;display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap;font:500 12px 'Space Grotesk',sans-serif;letter-spacing:.06em;pointer-events:none}
#tl b{color:var(--g);font-size:14px;letter-spacing:.2em}
#era{color:var(--c)}
#bar{flex-basis:100%;height:2px;background:rgba(255,255,255,.12)}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--c))}
#dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:14px}
#dots button{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--c);background:transparent;cursor:pointer;padding:0;transition:.25s}
#dots button:hover{background:var(--c)}
#dots button.a{background:var(--g);border-color:var(--g);transform:scale(1.35)}
#hint{position:fixed;top:58px;left:4vw;z-index:3;font-size:13px;color:#9fb3c8;pointer-events:none;display:flex;align-items:center;gap:10px;opacity:0}
#hint span{width:1.5px;height:30px;background:linear-gradient(var(--c),transparent);animation:dr 1.8s infinite}
@keyframes dr{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
#hud{position:fixed;top:10px;right:14px;z-index:8;display:flex;flex-direction:column;align-items:flex-end;gap:6px;opacity:0;pointer-events:none}
#hud button{padding:7px 12px;border-radius:6px;border:1px solid rgba(56,189,248,.5);background:rgba(5,10,20,.7);backdrop-filter:blur(8px);color:var(--c);font:600 12px 'Space Grotesk',sans-serif;letter-spacing:.05em;cursor:pointer}
#hud button:hover{background:rgba(56,189,248,.2)}
#sfx{font:500 11px/1.5 'Space Grotesk',sans-serif;color:var(--g);text-align:right;white-space:pre-line;max-width:300px}
#intro{position:fixed;inset:0;z-index:10;background:#010206;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw;overflow:hidden}
#cd{font:700 clamp(90px,24vw,300px)/1 'Space Grotesk',sans-serif;color:var(--c);text-shadow:0 0 40px rgba(56,189,248,.6);font-variant-numeric:tabular-nums}
#cdh{position:absolute;bottom:6vh;font-size:12px;color:#6b7f93;transition:opacity .5s}
#bc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:2px solid var(--c);opacity:0;pointer-events:none}
#ttl{opacity:0;position:relative}
#ttl h1{font:700 clamp(34px,7vw,92px)/1.05 Cinzel,serif;letter-spacing:.06em;background:linear-gradient(180deg,#f7e08a,#d4af37 55%,#8a6d1d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(56,189,248,.45))}
#ttl h1 small{display:block;font:500 clamp(18px,3.4vw,42px)/1.3 Cinzel,serif;letter-spacing:.14em;margin-top:6px}
#ttl p{margin-top:18px;font:500 clamp(14px,1.8vw,20px) 'Space Grotesk',sans-serif;color:#9fd8f5;letter-spacing:.08em}
#go{margin-top:38px;padding:15px 34px;font:600 15px 'Space Grotesk',sans-serif;letter-spacing:.22em;color:#e8f6ff;background:rgba(56,189,248,.08);border:1px solid var(--c);border-radius:4px;cursor:pointer;box-shadow:0 0 24px rgba(56,189,248,.45),inset 0 0 18px rgba(56,189,248,.2);animation:pu 2.2s infinite}
#go:hover{background:rgba(56,189,248,.25)}
@keyframes pu{50%{box-shadow:0 0 44px rgba(212,175,55,.7),inset 0 0 26px rgba(56,189,248,.3)}}
#rb{position:fixed;left:4vw;bottom:5vh;z-index:5;padding:12px 22px;border-radius:6px;border:1px solid var(--g);background:rgba(5,10,20,.75);backdrop-filter:blur(12px);color:var(--g);font:600 13px 'Space Grotesk',sans-serif;letter-spacing:.12em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s,background .2s}
#rb:hover{background:rgba(212,175,55,.18)}
@media(max-width:800px){#rb{bottom:auto;top:96px;left:3vw}}
body.lock{overflow:hidden}
.p{position:fixed;z-index:2;width:min(450px,42vw);padding:22px 26px;border-radius:16px;background:rgba(5,10,20,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 50px rgba(0,0,0,.5);opacity:0;pointer-events:none;max-height:78vh;overflow:auto}
.p.on{pointer-events:auto}
.p small{color:var(--g);font:500 12px 'Space Grotesk',sans-serif;letter-spacing:.04em}
.p h2{font:700 24px/1.2 'Space Grotesk',sans-serif;margin:5px 0 10px;color:#fff}
.p p{color:#cbd5e1;font-size:14.5px}
.left{left:4vw;top:13vh}
.right{right:5vw;top:13vh}
.right.low{top:auto;bottom:6vh}
.top{top:9vh;left:0;right:0;margin:auto;width:min(720px,90vw)}
.bottom{bottom:5vh;left:0;right:0;margin:auto;width:min(960px,92vw);text-align:center;background:linear-gradient(90deg,rgba(3,5,10,.2),rgba(10,18,34,.75),rgba(3,5,10,.2));border-radius:8px;border-left:0;border-right:0}
.term{color:var(--c);border-bottom:1px dotted var(--c);cursor:help}
.term:hover,.term:focus{color:#fff;outline:0}
#tip{position:fixed;z-index:6;width:300px;padding:12px 14px;border-radius:12px;background:rgba(6,12,26,.92);backdrop-filter:blur(12px);border:1px solid var(--c);font-size:13px;line-height:1.5;color:#dbe7f3;opacity:0;pointer-events:none;transition:opacity .2s}
#tip b{display:block;color:var(--g);font-family:'Space Grotesk',sans-serif;margin-bottom:3px}
@media(max-width:800px){
.p{width:auto!important;left:3vw!important;right:3vw!important;margin:0!important;max-height:46vh;padding:15px 18px}
.left,.right,.right.low{top:auto!important;bottom:4vh}
.top,.bottom{top:9vh!important;bottom:auto!important}
#dots{right:6px;gap:10px}
}
@media(prefers-reduced-motion:reduce){#hint span,#go{animation:none}}
</style>

<script>
/* ---------- Content ---------- */
const C=[
{y:'13.8 Billion Years Ago',t:'The Beginning',ps:[]},
{y:'13.8 – 13.6 Billion Years Ago',t:'The Primordial Void & First Light',ps:[['bottom','The universe cools and gravity takes over',
`Right after the {{Big Bang|The explosive expansion of space itself, about 13.8 billion years ago, that began everything we can observe.}}, the universe was a searing, opaque fog. As space expanded it cooled, and after about 380,000 years atoms of hydrogen and helium formed and light could finally travel freely. What followed were the Cosmic Dark Ages: no stars, only vast dark clouds of gas. Gravity slowly pulled the densest clumps together until their cores grew hot enough for {{nuclear fusion|The process where atomic nuclei are squeezed so hard they merge into heavier ones, releasing enormous energy. It is how stars shine.}}. The first {{Population III stars|The very first generation of stars, made only of hydrogen and helium. Many were tens to hundreds of times the Sun’s mass and lived only a few million years before exploding.}} ignited in bursts of light, and when they died they seeded space with the first heavier elements.`]]},
{y:'13.6 Billion Years Ago',t:'Birth of the Milky Way',ps:[['left','A galaxy takes shape',
`Smaller protogalactic clouds of gas, stars and {{dark matter|An invisible kind of matter that does not shine but has gravity. Its pull gathers gas into galaxies.}} fell toward each other and merged. A collapsing cloud spins faster as it shrinks, because of {{angular momentum|The amount of spin a rotating system keeps unless something pushes on it. A skater spins faster when pulling in their arms for the same reason.}}. Spin stops material from falling in sideways, so gas drops in only along the spin axis and the cloud flattens into a disk. The result was our Milky Way: a barred spiral about 100,000 light-years across, with a blazing core, a central bar, dusty spiral arms of young stars and 100–400 billion stars orbiting a {{supermassive black hole|A black hole millions of times heavier than the Sun. Ours, Sagittarius A*, weighs about 4 million Suns.}} at its heart.`]]},
{y:'4.6 Billion Years Ago',t:'The Solar Nebula & Supernova Trigger',ps:[['right','A shockwave wakes a sleeping cloud',
`In a quiet arm called the Orion Spur, about 26,000 light-years from the galactic core, drifted a {{molecular cloud|A cold, dense cloud of gas and dust, mostly hydrogen, where molecules survive and new stars can be born.}}. It held leftovers of earlier stars: carbon, oxygen, silicon and iron. Then a massive nearby star likely exploded as a {{supernova|The violent death of a massive star. It briefly outshines a whole galaxy and flings its material into space.}}. Its {{shockwave|A wall of fast-moving gas and pressure racing outward from an explosion.}} squeezed the cloud, and dense clumps crossed the tipping point of {{gravitational collapse|When a clump’s own gravity beats its internal pressure, so it falls inward and keeps shrinking.}}. Evidence: ancient meteorites contain decay products of aluminium-26 and iron-60, short-lived atoms made in exploding stars.`]]},
{y:'4.57 Billion Years Ago',t:'Ignition of the Proto-Sun',ps:[
['top','The Sun is born',`99.8% of the nebula’s mass fell into the center. Squeezed hard, it heated to about 10 million °C, hot enough for hydrogen nuclei to merge into helium. That moment of {{nuclear fusion|Atomic nuclei merging and releasing energy; here, hydrogen fusing into helium.}} made the Sun a true star. Before settling down it was a {{T Tauri star|A very young, variable star that flares violently and blows strong winds while it contracts toward adulthood.}}: blindingly bright and stormy.`],
['right low','Building planets from dust',`The remaining 0.2% spun into a flat {{protoplanetary disk|A rotating pancake of gas and dust around a young star, where planets are built.}}. Dust grains stuck together through {{electrostatic forces|The same static cling that makes a balloon stick to a wall.}}, growing into pebbles and then kilometer-wide {{planetesimals|Rocky or icy building blocks, from about a kilometer across upward, that collided to make planets.}}. Once big enough, gravity took over in {{accretion|Growth by gathering more material through collisions and gravity.}}. Near the hot Sun only rock and metal survived, so small rocky planets formed there; ice-rich giants formed farther out.`]]},
{y:'4.54 Billion Years Ago',t:'The Hadean Proto-Earth',ps:[['left','A world of fire',
`Within tens of millions of years, planetesimals merged into {{Proto-Earth|Earth in its earliest stage, still growing as rocky bodies crashed into it.}}. Constant impacts, the squeeze of its own gravity and {{radioactive decay|Unstable atoms breaking apart and releasing heat. Inside a young planet it was a huge heat source.}} melted it into a global {{magma ocean|A planet-wide layer of molten rock, hundreds of kilometers deep.}}. Heavy iron and nickel sank to the center while lighter rock floated up, a sorting called {{planetary differentiation|The separation of a molten planet into layers by density: a metal core, a rocky mantle and a thin crust.}}. Swirling liquid iron in the outer core creates a {{magnetosphere|The magnetic bubble around a planet. It deflects the solar wind and helps protect air and oceans.}}, the shield that later protects Earth. This fiery age is called the Hadean, after Hades.`]]},
{y:'4.5 Billion Years Ago',t:'The Giant Impact',ps:[['right','Theia strikes',
`A Mars-sized body, {{Theia|A hypothetical planet about the size of Mars that is thought to have hit the early Earth.}}, struck Proto-Earth with a glancing blow. Rock from both worlds vaporized and sprayed into orbit as a glowing ring, while Theia’s iron core sank into Earth’s. Over months to centuries, gravity clumped the debris into the Moon. The collision is also thought to have tipped Earth’s spin to a 23.5° {{axial tilt|The angle between a planet’s spin axis and its orbit. It makes the Sun climb higher or lower through the year, which gives us seasons.}}. The Moon’s gravity keeps that tilt steady, stabilizing our climate, and it raises the ocean tides.`]]},
{y:'4.4 – 3.8 Billion Years Ago',t:'The Great Cooling & First Oceans',ps:[
['bottom','For millions of years, it rained.',`As the surface cooled, steam became rain, and rain became oceans.`],
['left','Where the water came from',`{{Outgassing|Volcanoes releasing gases trapped inside a planet, mainly water vapor, carbon dioxide and nitrogen.}} built a thick steam atmosphere. As the crust cooled into dark {{basalt|A dark volcanic rock formed from cooled lava. It makes up today’s ocean floors.}}, the steam condensed into torrential rain that fell for millions of years. Icy asteroids and comets added still more water. By roughly 4.4–3.8 billion years ago, oceans filled the basins; ancient zircon crystals hint that liquid water existed as early as 4.4 billion years ago.`]]},
{y:'3.5 Billion Years Ago – Present Day',t:'The Pale Blue Dot',ps:[['right','Life and the blue sky',
`In deep-sea {{hydrothermal vents|Cracks in the seafloor spewing hot, mineral-rich water. Their chemical energy can feed life without sunlight.}}, chemistry may have sparked the first microbes by about 3.5 billion years ago. Later, {{cyanobacteria|Microscopic organisms that use sunlight, water and carbon dioxide to make food, releasing oxygen.}} spread through the oceans. Their oxygen triggered the {{Great Oxidation Event|The rise of oxygen about 2.4 billion years ago. It first rusted the iron in the oceans, then filled the air.}}. Some of it became the {{ozone layer|A high-altitude shield that absorbs harmful ultraviolet light from the Sun, letting life spread onto land.}}. Air and water scatter blue light, giving the pale blue dot, and drifting continents and the Moon’s tides shaped the living planet we know today.`]]}
];
const SD=[0,0,-1,1,1,-1,1,-1,1];
const $=s=>document.querySelector(s);
const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t,cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const g=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;

/* ---------- Panels, nav, tooltips ---------- */
const termRe=/\{\{(.+?)\|(.+?)\}\}/g;
const maxScroll=()=>document.documentElement.scrollHeight-innerHeight;
C.forEach((c,i)=>{
  c.ps.forEach(([pos,h,tx])=>{
    const d=document.createElement('div');d.className='p '+pos;d.dataset.c=i;
    d.innerHTML=`<small>Chapter ${i} · ${c.y}</small><h2>${h}</h2><p>${tx.replace(termRe,(m,a,b)=>`<span class="term" tabindex="0" data-d="${b}">${a}</span>`)}</p>`;
    $('#panels').appendChild(d);
  });
  if(i){const b=document.createElement('button');b.title=i+'. '+c.t;b.setAttribute('aria-label',c.t);
    b.onclick=()=>window.scrollTo({top:i/8*maxScroll(),behavior:'smooth'});$('#dots').appendChild(b);}
});
const tip=$('#tip');let pin=null;
function showTip(el){tip.innerHTML='<b>'+el.textContent+'</b>'+el.dataset.d;tip.style.opacity=1;
  const r=el.getBoundingClientRect();let y=r.bottom+8;if(y+tip.offsetHeight>innerHeight-10)y=r.top-tip.offsetHeight-8;
  tip.style.left=Math.max(8,Math.min(r.left,innerWidth-312))+'px';tip.style.top=Math.max(8,y)+'px';}
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{if(!pin&&e.target.closest&&e.target.closest('.term'))tip.style.opacity=0;});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('term'))showTip(e.target);});
document.addEventListener('focusout',()=>{if(!pin)tip.style.opacity=0;});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('.term');
  if(t){pin=pin===t?null:t;showTip(t);if(!pin)tip.style.opacity=0;}else{pin=null;tip.style.opacity=0;}});

/* ---------- Scroll driver ---------- */
gsap.registerPlugin(ScrollTrigger);
let f=0,tf=0,ci=-1,started=false,mx=0,my=0,smx=0,smy=0,render=null,T=0;
if('scrollRestoration' in history)history.scrollRestoration='manual';scrollTo(0,0);document.body.classList.add('lock');tf=f=0;
ScrollTrigger.create({trigger:'#sp',start:'top top',end:'bottom bottom',onUpdate:s=>{tf=s.progress*8},onRefresh:s=>{tf=s.progress*8}});
addEventListener('mousemove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1;});
gsap.set('.p',{opacity:0,y:30});
function setChap(c){ci=c;const d=C[c];
  $('#era').textContent=(c?'Chapter '+c+' · ':'')+d.y+' — '+d.t;
  document.querySelectorAll('.p').forEach(el=>{const on=+el.dataset.c===c;el.classList.toggle('on',on);
    gsap.to(el,{opacity:on?1:0,y:on?0:30,duration:on?.9:.45,overwrite:true});});
  document.querySelectorAll('#dots button').forEach((b,i)=>b.classList.toggle('a',i+1===c));}
setChap(0);
gsap.ticker.add((tm,dms)=>{
  const dt=Math.min(dms/1000,.05);T+=dt;
  f+=(tf-f)*(1-Math.exp(-dt*4.5));
  smx+=(mx-smx)*.05;smy+=(my-smy)*.05;
  const c=Math.round(f);if(c!==ci)setChap(c);
  $('#bar i').style.width=(f/8*100)+'%';
  $('#hint').style.opacity=started?cl(3-f*2):0;hudAudio();{const rb=$('#rb'),on=started&&f>7.5;rb.style.opacity=on?1:0;rb.style.pointerEvents=on?'auto':'none';}
  if(render)render(dt);
});

/* ---------- RealisticAudioEngine (all synthesized) ---------- */
let bloomS=1.6;
class RealisticAudioEngine{
  constructor(){
    let c=null;try{c=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
    this.c=c;this.muted=false;this.on=false;this.ex={};this.nb={};this.tB=0;this.tP=0;this.riser=false;this.w={};
    if(!c)return;
    this.out=c.createGain();const cp=c.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=8;this.out.connect(cp);cp.connect(c.destination);
    const n=c.sampleRate*3,ir=c.createBuffer(2,n,c.sampleRate);          /* 3 s stereo cathedral impulse response */
    for(let h=0;h<2;h++){const d=ir.getChannelData(h);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}
    this.rev=c.createConvolver();this.rev.buffer=ir;const rw=c.createGain();rw.gain.value=.5;this.rev.connect(rw);rw.connect(this.out);
    this.bus=c.createGain();this.bus.connect(this.out);this.bus.connect(this.rev);
    const cv=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;cv[i]=(Math.PI+50)*x/(Math.PI+50*Math.abs(x));}this.cv=cv;
  }
  ok(){return this.c&&this.c.state==='running';}
  flag(n,sec){this.ex[n]=performance.now()+sec*1000;}
  node(t,f,q){const b=this.c.createBiquadFilter();b.type=t;b.frequency.value=f;if(q)b.Q.value=q;return b;}
  nz(t){if(this.nb[t])return this.nb[t];const c=this.c,n=c.sampleRate*4,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,l=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;
      if(t==='white')d[i]=w;else if(t==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5;}
      else{b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.2;b6=w*.115926;}}
    return this.nb[t]=b;}
  ns(t,dest){const s=this.c.createBufferSource();s.buffer=this.nz(t);s.loop=true;s.connect(dest);return s;}
  env(g,t,pk,a,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
  shot(type,dur,pk,fl,o){o=o||{};if(!this.ok())return;const c=this.c,t=c.currentTime,s=c.createBufferSource(),g=c.createGain(),at=o.att||.01;
    s.buffer=this.nz(type);s.loop=true;let n=s;
    if(fl){n.connect(fl);n=fl;if(o.f1){fl.frequency.setValueAtTime(o.f0,t);fl.frequency.exponentialRampToValueAtTime(o.f1,t+dur);}}
    if(o.ws){const w=c.createWaveShaper();w.curve=this.cv;n.connect(w);n=w;}
    n.connect(g);let e=g;
    if(o.pan){const p=c.createStereoPanner();p.pan.setValueAtTime(o.pan[0],t);p.pan.linearRampToValueAtTime(o.pan[1],t+dur);g.connect(p);e=p;}
    e.connect(o.dry?this.out:this.bus);this.env(g,t,pk,at,dur-at);s.start(t,Math.random()*2);s.stop(t+dur+.1);}
